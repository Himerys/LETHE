[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "LETHE"
version = "0.4.0"
description = "Scan your mailbox, find every service that knows you, and decimate your digital footprint with GDPR Art. 17 erasure requests."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Himerys" }]
keywords = ["gdpr", "privacy", "dsgvo", "thunderbird", "betterbird", "right-to-erasure"]
classifiers = [
  "Environment :: Console",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Topic :: Communications :: Email",
  "Topic :: Security",
]
dependencies = [
  "requests>=2.28",
  "beautifulsoup4>=4.11",
  "rich>=13.0",
  "tldextract>=3.4",
]

[project.optional-dependencies]
dev = ["pytest", "pyinstaller"]

[project.scripts]
fpd = "LETHE.cli:main"

[project.urls]
Homepage = "https://github.com/Himerys/LETHE"

[tool.setuptools]
packages = ["LETHE"]

[tool.setuptools.package-data]
LETHE = ["data/*.json"]
